name: Docker Image

# 什么时候构建：
#   1. 推 main（且改动涉及镜像内容）-> 产出 ghcr.io/<owner>/jaysql:latest
#   2. 推 v* 标签                       -> 产出 :1.99 / :1.99.0 / :latest
#   3. 手动 Run workflow                -> 同上，用当前分支
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "www/**"
      - "docs/**"
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
    tags:
      - "v*"
  workflow_dispatch:

env:
  # 镜像名必须全小写（GHCR 规定）；仓库名 JaySQL 有大写，所以这里写死 jaysql
  IMAGE: ghcr.io/${{ github.repository_owner }}/jaysql

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # checkout 源码
      packages: write # 推送 GHCR 镜像

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 打标签规则：tag 推送产出语义化版本，main 推送产出 latest
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 直接调 buildx 而不是用 build-push-action，为的是失败时能把日志尾部
      # 通过 ::error:: 注解暴露出来 —— action 内部日志匿名访问拿不到。
      - name: Build and push
        run: |
          set -o pipefail
          TAGS=()
          while IFS= read -r t; do
            [ -n "$t" ] && TAGS+=(--tag "$t")
          done <<< "${{ steps.meta.outputs.tags }}"
          echo "将推送标签：${TAGS[*]}"

          docker buildx build \
            --platform linux/amd64 \
            --build-arg VERSION="${GITHUB_REF_NAME}" \
            --file docker/Dockerfile \
            --progress=plain \
            "${TAGS[@]}" \
            --push \
            . 2>&1 | tee /tmp/build.log || {
              echo "::error title=Docker build failed::$(tail -30 /tmp/build.log | tr '\n' '~' | cut -c1-2900)"
              exit 1
            }

      - name: Summary
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "拉取：\`docker pull ${IMAGE}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
